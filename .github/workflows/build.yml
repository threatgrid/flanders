name: Build

on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master
  schedule:
    # 12:00AM on the first of every month
    - cron: "0 0 1 * *"

# Least-privilege default token: this workflow only builds, lints and tests.
permissions:
  contents: read

jobs:
  setup:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      matrix: ${{ steps.set-matrix.outputs.matrix }}
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
      - name: Install clojure tools
        uses: DeLaGuardo/setup-clojure@fa522696baadfef7de0fe810135f446221e665c2 # 3.7
        with:
          lein: 2.9.8
      - name: Cache project dependencies
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: |
            ~/.m2/repository
            ~/.gitlibs
          key: ${{ runner.os }}-clojure-${{ hashFiles('**/project.clj', '**/deps.edn') }}
          restore-keys: |
            ${{ runner.os }}-clojure
      - name: Warm deps cache
        run: |
          for i in {1..10}; do lein deps :tree && break; done
      - id: set-matrix
        run: |
          set -x
          case "${GITHUB_EVENT_NAME}" in
            #scheduled)
            #  echo '::set-output name=matrix::{"jdk":["11","17","21"],"cmd":["test"]}}'
            # ;;
            *)
              echo '::set-output name=matrix::{"jdk":["11","17","21"],"cmd":["test"]}}'
              ;;
          esac
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - name: Install Java
        uses: actions/setup-java@17f84c3641ba7b8f6deff6309fc4c864478f5d62 # v3.14.1
        with:
          distribution: 'temurin'
          java-version: '8'

      - name: Install clojure tools
        uses: DeLaGuardo/setup-clojure@0fc99a3bcdd086349bfb01a9262382fe3d37cd6d # 12.1
        with:
          clj-kondo: '2023.12.15'

      - name: Check clojure code
        run:
          ./bin/lint
  test:
    needs: setup
    strategy:
      matrix: ${{fromJson(needs.setup.outputs.matrix)}}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
      - name: Cache project dependencies
        uses: actions/cache@6f8efc29b200d32929f49075959781ed54ec270c # v3.5.0
        with:
          path: |
            ~/.m2/repository
            ~/.gitlibs
          key: ${{ runner.os }}-clojure-${{ hashFiles('**/project.clj', '**/deps.edn') }}
          restore-keys: |
            ${{ runner.os }}-clojure
      - name: Prepare java
        uses: actions/setup-java@91d3aa4956ec4a53e477c4907347b5e3481be8c9 # v2.5.1
        with:
          distribution: 'temurin'
          java-version: ${{ matrix.jdk }}
      - name: Install clojure tools
        uses: DeLaGuardo/setup-clojure@fa522696baadfef7de0fe810135f446221e665c2 # 3.7
        with:
          lein: 2.9.8
      - run: |
          set -x
          eval 'lein do clean, compile :all, ${CMD}'
        env:
          CMD: ${{ matrix.cmd }}
  all-pr-checks:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: [test, lint]
    steps:
      - run: echo "All tests pass!"
